services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticketmaster
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketmaster"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Só holds efêmeros: sem persistência em disco.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Busca de eventos (ADR-013): índice derivado do Postgres, alimentado pelo
  # search_outbox. Nó único e sem segurança: só para estudo/local.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node          # também desliga os bootstrap checks de produção
      xpack.security.enabled: "false"      # sem TLS/usuário (local)
      action.auto_create_index: "false"    # escrever num índice inexistente = erro, não índice com mapping errado
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Observabilidade (ADR-011): OTel Collector + Prometheus (métricas) + Tempo (traces)
  # + Loki (logs) + Grafana num só container, para estudo. Grafana: http://localhost:3000
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "3000:3000"   # Grafana (login anônimo como admin já habilitado na imagem)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (usado pelo backend)
    volumes:
      - ./observability/grafana/provisioning/ticketmaster.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ticketmaster.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/ticketmaster-dashboards:ro
      - lgtmdata:/data   # métricas/traces/logs sobrevivem a "docker compose down"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ticket:ticket@postgres:5432/ticketmaster?sslmode=disable
      PORT: "8080"
      RESERVATION_TTL: 5m
      SEED_ON_START: "true"
      # Seat gate em Redis (ADR-010). Deixe vazio para comparar com "só Postgres".
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      # OpenTelemetry (ADR-011). Vazio desliga a telemetria (só logs JSON no stdout).
      # Para mandar ao Datadog: apontar para um Datadog Agent com OTLP habilitado.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://lgtm:4318}
      OTEL_SERVICE_NAME: ticketmaster-api
      # Busca com Elasticsearch (ADR-013). Vazio => busca ILIKE só no Postgres.
      ES_URL: ${ES_URL-http://elasticsearch:9200}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started   # ES demora ~30 s; até lá a busca usa o fallback e o indexer tenta de novo
      lgtm:
        condition: service_started   # exporter tenta de novo sozinho se o coletor ainda não subiu
    healthcheck:
      # Liveness (não depende de Postgres/Redis). wget vem do busybox do alpine.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app          # hot reload do código
      - /app/node_modules        # mantém o node_modules da imagem
    depends_on:
      - backend

volumes:
  pgdata:
  esdata:
  lgtmdata:
